<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f4e79">
<title>Rodzina: drzewo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/osoby"><img src="icon.svg" alt="" width="26" height="26"><span>Rodzina</span></a>
  <nav id="nav" aria-label="Widoki">
    <a data-view="osoby" href="#/osoby">Osoby</a>
    <a data-view="tablica" href="#/tablica">Tablica</a>
    <a data-view="statystyki" href="#/statystyki">Statystyki</a>
    <a data-view="kontrola" href="#/kontrola">Kontrola <span id="issues" class="badge" hidden></span></a>
    <a data-view="narzedzia" href="#/narzedzia">Narzędzia</a>
  </nav>
  <div class="actions">
    <button id="undo" title="Cofnij (Ctrl+Z)" disabled>↶</button>
    <button id="redo" title="Ponów (Ctrl+Y)" disabled>↷</button>
    <label class="btn primary">Wczytaj .ged<input id="file" type="file" accept=".ged,.gedcom,text/plain" hidden></label>
    <button id="export" disabled>Pobierz .ged</button>
    <button id="theme" title="Jasny / ciemny motyw" aria-label="Zmień motyw">◐</button>
  </div>
</header>
<div id="msg" role="status" aria-live="polite"></div>
<main id="main"></main>
<script type="module" src="app.js"></script>
</body>
</html>
