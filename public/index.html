<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbf5ef">
<title>ANIZDOR: drzewo rodziny</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="viz.css">
<link rel="stylesheet" href="theme.css">
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<header class="top">
  <a class="brand" href="#/tablica" aria-label="ANIZDOR"><img class="logo logo-light" src="logo.png" alt="ANIZDOR" width="131" height="40"><img class="logo logo-dark" src="logo-dark.png" alt="" width="131" height="40"></a>
  <nav id="nav" aria-label="Widoki">
    <a data-view="tablica" href="#/tablica">Drzewo</a>
    <a data-view="osoby" href="#/osoby">Osoby</a>
    <a data-view="os-czasu" href="#/os-czasu">Oś czasu</a>
    <a data-view="miejsca" href="#/miejsca">Miejsca</a>
    <a data-view="statystyki" href="#/statystyki">Statystyki</a>
    <a data-view="narzedzia" href="#/narzedzia" title="Narzędzia, źródła i kontrola danych">Narzędzia <span id="issues" class="badge" hidden title="Uwagi w kontroli danych"></span></a>
  </nav>
  <div class="actions">
    <button id="undo" title="Cofnij (Ctrl+Z)" disabled>↶</button>
    <button id="redo" title="Ponów (Ctrl+Y)" disabled>↷</button>
    <label class="btn primary icb" title="Wczytaj plik .ged lub .zip (ze zdjęciami)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M5 15v4h14v-4"/></svg><span class="lbl">Wczytaj</span><input id="file" type="file" accept=".ged,.gedcom,.zip,text/plain,application/zip" hidden></label>
    <button id="export" class="icb" title="Pobierz drzewo jako plik .ged" aria-label="Pobierz .ged" disabled><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 15v4h14v-4"/></svg><span class="lbl">Pobierz</span></button>
    <button id="cloud" class="cloud-btn" type="button">☁</button>
    <a id="gh" class="btn icb" href="https://github.com/itstomekk/anizdor" target="_blank" rel="noopener" title="Kod aplikacji na GitHubie" aria-label="GitHub"><svg class="ic gh" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.95 0-1.09.39-1.99 1.03-2.69-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.03a9.5 9.5 0 0 1 5 0c1.91-1.3 2.75-1.03 2.75-1.03.55 1.38.2 2.4.1 2.65.64.7 1.03 1.6 1.03 2.69 0 3.85-2.34 4.7-4.57 4.94.36.31.68.92.68 1.86v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg></a>
    <button id="theme" title="Jasny / ciemny motyw" aria-label="Zmień motyw">◐</button>
  </div>
</header>
<div id="msg" role="status" aria-live="polite"></div>
<main id="main"></main>
<script type="module" src="app.js"></script>
</body>
</html>
