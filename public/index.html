<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbf5ef">
<title>ANIZDOR: drzewo rodziny</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="viz.css">
<link rel="stylesheet" href="theme.css">
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<header class="top">
  <a class="brand" href="#/osoby" aria-label="ANIZDOR"><img class="logo logo-light" src="logo.png" alt="ANIZDOR" width="131" height="40"><img class="logo logo-dark" src="logo-dark.png" alt="" width="131" height="40"></a>
  <nav id="nav" aria-label="Widoki">
    <a data-view="osoby" href="#/osoby">Osoby</a>
    <a data-view="tablica" href="#/tablica">Tablica</a>
    <a data-view="os-czasu" href="#/os-czasu">Oś czasu</a>
    <a data-view="miejsca" href="#/miejsca">Miejsca</a>
    <a data-view="zrodla" href="#/zrodla">Źródła</a>
    <a data-view="statystyki" href="#/statystyki">Statystyki</a>
    <a data-view="kontrola" href="#/kontrola">Kontrola <span id="issues" class="badge" hidden></span></a>
    <a data-view="narzedzia" href="#/narzedzia">Narzędzia</a>
  </nav>
  <div class="actions">
    <button id="undo" title="Cofnij (Ctrl+Z)" disabled>↶</button>
    <button id="redo" title="Ponów (Ctrl+Y)" disabled>↷</button>
    <label class="btn primary">Wczytaj .ged / .zip<input id="file" type="file" accept=".ged,.gedcom,.zip,text/plain,application/zip" hidden></label>
    <button id="export" disabled>Pobierz .ged</button>
    <button id="cloud" class="cloud-btn" type="button">☁</button>
    <button id="theme" title="Jasny / ciemny motyw" aria-label="Zmień motyw">◐</button>
  </div>
</header>
<div id="msg" role="status" aria-live="polite"></div>
<main id="main"></main>
<script type="module" src="app.js"></script>
</body>
</html>
