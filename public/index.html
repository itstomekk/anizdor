<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rodzina: drzewo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Rodzina</h1>
  <div class="actions">
    <label class="btn">Wczytaj .ged<input id="file" type="file" accept=".ged,.gedcom,text/plain" hidden></label>
    <button id="export" disabled>Pobierz .ged</button>
    <button id="new">+ Osoba</button>
    <button id="wipe" class="ghost" disabled>Usuń dane z przeglądarki</button>
  </div>
</header>
<div id="msg" role="status"></div>
<main>
  <aside>
    <input id="q" type="search" placeholder="Szukaj osoby…" autocomplete="off">
    <ul id="list"></ul>
  </aside>
  <section id="view">
    <div id="empty">
      <h2>Zacznij od pliku .ged</h2>
      <p>Wczytaj GEDCOM z Ahnenblatt, MyHeritage, Gramps lub innego programu. Dane zostają w tej przeglądarce i nie są wysyłane na żaden serwer.</p>
    </div>
    <div id="person" hidden>
      <nav class="tabs">
        <button data-tab="info" class="on">Osoba</button>
        <button data-tab="anc">Przodkowie</button>
        <button data-tab="desc">Potomkowie</button>
      </nav>
      <div id="tab-info"></div>
      <div id="tab-tree" hidden>
        <div class="treebar">
          <label>Pokolenia <select id="gens"><option>3</option><option selected>5</option><option>7</option><option>9</option></select></label>
          <button id="svg">Pobierz SVG</button>
          <button id="print">Drukuj / PDF</button>
        </div>
        <div id="canvas"></div>
      </div>
    </div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
